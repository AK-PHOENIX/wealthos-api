services:
  - type: web
    name: wealthos-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: wealthos-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: FRONTEND_URL
        value: https://wealthos-frontend.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 3000

databases:
  - name: wealthos-db
    databaseName: wealthos
    plan: free
